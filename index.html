<style>

<script>
const $=s=>document.querySelector(s),K='kepsek_sim_v1',A={},P={};

const FAC={kelas:{n:'Ruang Kelas',c:25e6,d:5,i:'door-open'},perpus:{n:'Perpustakaan',c:30e6,d:6,i:'library'},labkom:{n:'Lab Komputer',c:45e6,d:8,i:'monitor'},labipa:{n:'Lab IPA',c:40e6,d:8,i:'flask-conical'},kantin:{n:'Kantin',c:20e6,d:4,i:'utensils'},lapangan:{n:'Lapangan Olahraga',c:35e6,d:7,i:'trophy'},toilet:{n:'Toilet',c:10e6,d:3,i:'bath'},guru:{n:'Ruang Guru',c:15e6,d:4,i:'users'},kepsek:{n:'Ruang Kepala Sekolah',c:12e6,d:3,i:'briefcase'},uks:{n:'UKS',c:10e6,d:3,i:'heart-pulse'},musala:{n:'Musala',c:18e6,d:4,i:'moon'},aula:{n:'Aula Sekolah',c:60e6,d:10,i:'landmark'},tu:{n:'Ruang Tata Usaha',c:12e6,d:3,i:'file-text'},bk:{n:'Ruang BK',c:10e6,d:3,i:'message-circle'}};
const RI={ac:['AC',4e6],proj:['Proyektor',3.5e6],board:['Whiteboard',1.5e6],light:['Lampu LED',1e6],clean:['Bersihkan',2e5],fix:['Perbaiki',1.5e6]};

const ACT={up:{n:'Upacara & Pramuka',c:1e6,hp:4,rep:.2},ob:{n:'Class Meeting',c:2e6,hp:8,rep:.2},sos:{n:'Bakti Sosial',c:1e6,hp:5,rep:.3},pen:{n:'Pentas Seni',c:5e6,hp:10,rep:.6},tour:{n:'Study Tour',c:15e6,hp:15,rep:1},lomba:{n:'Ikut Lomba Akademik',c:3e6,hp:4,rep:.2}};
const POS=[...SUBJ.map(s=>['m:'+s,'Guru '+s]),['r:Guru BK','Guru BK'],['r:Kepala Tata Usaha','Kepala Tata Usaha'],['r:Petugas Kebersihan','Petugas Kebersihan'],['r:Satpam','Satpam'],['r:Wakil Kepala Sekolah','Wakil Kepala Sekolah']];
const MENU=[['dash','Dashboard','layout-dashboard'],['kls','Manajemen Kelas','school'],['sis','Data Siswa','graduation-cap'],['gur','Data Guru','users'],['jdw','Jadwal Pelajaran','calendar-clock'],['akd','Akademik','book-open'],['bgn','Pembangunan','hammer'],['keu','Keuangan','wallet'],['evt','Event Sekolah','sparkles'],['cal','Kalender Akademik','calendar-days'],['ach','Achievement','award'],['d3','Jelajah 3D','box'],['set','Pengaturan','settings']];
let S,page='dash',selC=null,fC='all',calM=null,CAND=[],AC=null,acc=0;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],nm=()=>pick(FN)+' '+pick(LN);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const avg=(a,f)=>a.length?a.reduce((x,y)=>x+f(y),0)/a.length:0,pb=v=>`<div class="bar"><i style="width:${clamp(v)}%"></i></div>`;
const cls=id=>S.classes.find(c=>c.id===id),T=id=>S.teachers.find(t=>t.id===id),stu=id=>S.students.filter(s=>s.cls===id),uid=()=>S.nid++;
const sid=p=>S.students.find(s=>s.id===+p),icons=()=>{try{lucide.createIcons()}catch(e){}};
const dstr=iso=>new Date(iso+'T00:00:00Z').toLocaleDateString('id-ID',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long',year:'numeric'});
const guruList=()=>S.teachers.filter(t=>t.sub!=='-'&&t.act);
/* ===== JAM WIB ASLI ===== */
const FD=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}),FT=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function clock(){const n=new Date(),t=FT.formatToParts(n).filter(p=>p.type!=='literal').map(p=>p.value).join(':');document.querySelectorAll('.clk-t').forEach(e=>e.textContent=t+' WIB');document.querySelectorAll('.clk-d').forEach(e=>e.textContent=FD.format(n))}
/* ===== UI HELPERS ===== */
function toast(t){const e=document.createElement('div');e.className='to';e.textContent=t;$('#toast').append(e);setTimeout(()=>e.remove(),3200)}
function snd(f=520){if(!S||!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.07)}catch(e){}}
function modal(h){const m=$('#mod');m.innerHTML='<div>'+h+'</div>';m.style.display='flex';icons()}
function close(){$('#mod').style.display='none'}
function done(){chkAch();render();save()}
function ask(title,F,fn,ok='Simpan'){modal(`<h2>${title}</h2>${F.map(f=>`<label>${f.l}${f.t==='select'?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]==f.v?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${f.v??''}">`}</label>`).join('')}<div class="row"><button class="btn" id="okb">${ok}</button><button class="btn s" data-a="x">Batal</button></div>`);
$('#okb').onclick=()=>{const v={};F.forEach(f=>{const e=$('#f_'+f.k);v[f.k]=f.t==='number'?+e.value:e.value});if(fn(v)!==false){close();done()}}}
function conf(msg,fn){modal(`<h2>Konfirmasi</h2><p style="margin-bottom:14px">${msg}</p><div class="row"><button class="btn r" id="okb">Ya, lanjutkan</button><button class="btn s" data-a="x">Batal</button></div>`);$('#okb').onclick=()=>{close();fn();done()}}
/* ===== DATA ===== */
function mkT(sub,role){const g=Math.random()<.5?'L':'P',sk=rnd(50,85),av={'Petugas Kebersihan':'🧹','Satpam':'💂','Kepala Tata Usaha':'🗂️','Guru BK':'🧑‍🏫','Wakil Kepala Sekolah':'👔'}[role]||(g==='L'?'👨‍🏫':'👩‍🏫');return{id:uid(),name:nm()+(sub!=='-'?', S.Pd.':''),sub,role,age:rnd(24,55),g,sal:Math.round((3e6+sk*30000+rnd(0,3)*1e5)/1e5)*1e5,skill:sk,disc:rnd(60,90),act:true,av}}
function mkS(c){return{id:uid(),name:nm(),g:Math.random()<.5?'L':'P',cls:c,nilai:rnd(60,82),disc:rnd(60,92),hadir:rnd(90,99),role:'',ach:[]}}
function mkC(n,lv,cap){const c={id:uid(),name:n,lv,cap,open:true,wali:null,room:{no:101+S.rc++,ac:0,proj:0,board:0,light:0,clean:90,cond:100}};S.classes.push(c);return c}
const blank=()=>Array.from({length:5},()=>Array(6).fill(null)),sch=id=>S.sch[id]||(S.sch[id]=blank());
function newGame(){S={school:'SMP Harapan Bangsa',kepsek:'Kepala Sekolah',money:1e8,rep:50,happy:75,ortu:70,fee:150000,date:'2026-07-13',nid:1,rc:0,day:0,classes:[],students:[],teachers:[],sch:{},fac:{},build:[],tx:[],fin:[],log:[],ach:{},pool:6,tunj:true,snd:true,spd:20,tut:true,pend:null,cd:{bos:-99},rules:{},lulus:0,lv:1};
for(const k in FAC)S.fac[k]={lv:0,cond:100};Object.assign(S.fac.kelas,{lv:3});['toilet','guru','kepsek','tu'].forEach(k=>S.fac[k].lv=1);
['Matematika','Bahasa Indonesia','Bahasa Inggris','IPA','IPS'].forEach(s=>S.teachers.push(mkT(s,'Guru Mata Pelajaran')));
['Petugas Kebersihan','Satpam','Kepala Tata Usaha'].forEach(r=>S.teachers.push(mkT('-',r)));
['7A','7B','7C'].forEach((n,i)=>{const c=mkC(n,7,32);c.wali=S.teachers[i].id;for(let j=0;j<10;j++)S.students.push(mkS(c.id))});
autoSch();note('Selamat datang di KEPSEK SIMULATOR! Semoga sukses memimpin sekolah.')}
function note(t){S.log.unshift(dstr(S.date)+' — '+t);if(S.log.length>40)S.log.pop()}
function tx(t,amt,cat){S.money+=amt;S.tx.unshift({d:S.date,t,a:amt,c:cat});if(S.tx.length>150)S.tx.pop();const m=S.date.slice(0,7);let f=S.fin.find(x=>x.m===m);if(!f){f={m,i:0,o:0};S.fin.push(f);if(S.fin.length>12)S.fin.shift()}amt>0?f.i+=amt:f.o-=amt}
function spend(c,t,cat){if(S.money<c){toast('Uang sekolah tidak cukup!');return false}tx(t,-c,cat);return true}
function fx(o){if(o.m)tx(o.m>0?'Dana event':'Biaya event',o.m,'Event');if(o.rep)S.rep=clamp(S.rep+o.rep);if(o.hp)S.happy=clamp(S.happy+o.hp);if(o.or)S.ortu=clamp(S.ortu+o.or)}
function delT(id){S.teachers=S.teachers.filter(t=>t.id!==id);S.classes.forEach(c=>{if(c.wali===id)c.wali=null});slotsOut(id)}
function slotsOut(id){for(const k in S.sch)S.sch[k].forEach(d=>d.forEach((s,i)=>{if(s&&s.t===id)d[i]=null}))}
const load=id=>{let n=0;for(const k in S.sch)S.sch[k].forEach(d=>d.forEach(s=>{if(s&&s.t===id)n++}));return n};
const eff=t=>clamp(t.skill-Math.max(0,load(t.id)-25)*1.5),qual=()=>avg(guruList(),eff);
const roomScore=c=>{const r=c.room;return Math.round((r.ac?18:8)+(r.proj?12:0)+(r.board?8:3)+(r.light?10:5)+r.cond*.3+r.clean*.2)};
const ruleSum=k=>Object.keys(S.rules).filter(r=>S.rules[r]).reduce((x,r)=>x+RULES[r][k],0);
const score=()=>S.rep+Object.keys(S.ach).length*2+S.students.length/10+Object.values(S.fac).reduce((x,f)=>x+f.lv,0)/3;
const level=()=>{const s=score();return[0,60,72,85,100,120].filter(x=>s>=x).length},rankK=()=>Math.max(1,Math.round(50-(score()-45)*.8)),rankN=()=>Math.max(1,Math.round(3000-(score()-45)*30));
function conflict(t,d,sl,exc){return S.classes.some(c=>c.id!==exc&&S.sch[c.id]&&S.sch[c.id][d][sl]&&S.sch[c.id][d][sl].t===t)}
function autoSch(){S.classes.filter(c=>c.open).forEach(c=>{S.sch[c.id]=blank();let i=0;for(let d=0;d<5;d++)for(let sl=0;sl<6;sl++){for(let k=0;k<SUBJ.length;k++){const sub=SUBJ[(i++)%SUBJ.length],ts=guruList().filter(t=>t.sub===sub&&!conflict(t.id,d,sl,c.id)).sort((a,b)=>load(a.id)-load(b.id));if(ts.length){S.sch[c.id][d][sl]={s:sub,t:ts[0].id};break}}}})}
/* ===== KALENDER & WAKTU SIMULASI ===== */
function dayInfo(d){const m=d.getUTCMonth()+1,k=m*100+d.getUTCDate(),w=d.getUTCDay(),H={101:'Tahun Baru',501:'Hari Buruh',601:'Hari Pancasila',817:'HUT RI',1225:'Natal'};let off=1,label,ex=0;
if(H[k])label=H[k];else if(k>=1222||k<=103||(k>=622&&k<=711))label='Libur Semester';else if(w%6===0)label='Akhir Pekan';else{off=0;label='Belajar';if((k>=928&&k<=1002)||(k>=302&&k<=306)){ex=1;label='UTS'}else if((k>=1207&&k<=1211)||(k>=608&&k<=612)){ex=2;label='UAS'}}
const tag=({713:'Tahun Ajaran Baru',1028:'Sumpah Pemuda',1125:'Hari Guru',502:'Hardiknas'})[k]||(k>=601&&k<=620?'PPDB':'');return{off,label,ex,tag}}
function nextOf(f){const d=new Date(S.date+'T00:00:00Z');for(let i=0;i<400;i++){d.setUTCDate(d.getUTCDate()+1);const I=dayInfo(d);if(f(I))return dstr(d.toISOString().slice(0,10))+' ('+(I.tag||I.label)+')'}return '-'}
function promote(s){const c=cls(s.cls);if([6,9,12].includes(c.lv)){if(s.nilai<55)return'tl';S.students=S.students.filter(x=>x!==s);S.lulus++;S.rep=clamp(S.rep+.05);return'lulus'}
const t=S.classes.filter(k=>k.open&&k.lv===c.lv+1&&stu(k.id).length<k.cap).sort((a,b)=>stu(a.id).length-stu(b.id).length)[0];if(!t)return'nc';s.cls=t.id;s.role='';return'ok'}
function promAll(){const r={ok:0,lulus:0,tl:0,nc:0};[...S.students].sort((a,b)=>cls(b.cls).lv-cls(a.cls).lv).forEach(s=>r[promote(s)]++);return r}
function nextDay(){const d=new Date(S.date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);S.date=d.toISOString().slice(0,10);S.day++;const I=dayInfo(d);
if(S.date.slice(5)==='07-13'){const r=promAll();S.pool+=10;S.teachers.forEach(t=>t.age++);toast('🎓 Tahun ajaran baru! Lulus '+r.lulus+', naik '+r.ok);note('Tahun ajaran baru: '+r.lulus+' lulus, '+r.ok+' naik kelas, '+r.tl+' tidak lulus')}
if(d.getUTCDate()===1)monthly();
S.build=S.build.filter(b=>{if(--b.left>0)return true;const f=S.fac[b.k];f.lv++;f.cond=100;S.rep=clamp(S.rep+(b.k==='kelas'?.3:.8));toast('✅ '+FAC[b.k].n+' selesai');note(FAC[b.k].n+' selesai (level '+f.lv+')');return false});
for(const k in S.fac){const f=S.fac[k];if(f.lv)f.cond=clamp(f.cond-(.15+.1*f.lv)*Math.random()*2)}
const cl=S.teachers.filter(t=>t.act&&t.role==='Petugas Kebersihan').length;S.classes.forEach(c=>{c.room.cond=clamp(c.room.cond-Math.random()*.5);c.room.clean=clamp(c.room.clean-.8/(1+cl))});
S.teachers.forEach(t=>{if(!t.act)return;if(load(t.id)>25){t.skill=clamp(t.skill-.03);t.disc=clamp(t.disc-.05)}t.sal<3e6+t.skill*25000?t.disc=clamp(t.disc-.03):t.disc=clamp(t.disc+.01)});
if(!I.off){const q=qual(),lab=S.fac.labkom.lv*2+S.fac.labipa.lv*2+S.fac.perpus.lv*1.5,rd=ruleSum('d'),mt=avg(S.teachers.filter(t=>t.act),t=>t.disc);
S.classes.forEach(c=>{const ss=stu(c.id),cm=roomScore(c),ov=ss.length>c.cap;ss.forEach(s=>{s.hadir=clamp(s.hadir+(cm-50)/250+(S.happy-60)/300+rnd(-10,10)/25-(ov?.3:0),50,100);s.disc=clamp(s.disc+rd+(mt-60)/500+rnd(-8,8)/25,20,100);if(I.ex)s.nilai=clamp(s.nilai*.8+.2*clamp(35+q*.35+s.disc*.12+cm*.15+lab+rnd(-6,6),30,98),20,100)})});
const key=I.label+S.date.slice(0,7);if(I.ex&&S.exk!==key){S.exk=key;toast('📝 '+I.label+' dimulai');note(I.label+' dimulai, rata-rata nilai '+avg(S.students,s=>s.nilai).toFixed(1))}
if(!S.pend&&Math.random()<.12)trigger()}
S.pool+=I.tag==='PPDB'?rnd(0,Math.ceil(S.rep/15)):(Math.random()<.1?rnd(0,2):0);

let n=0;const ss=Math.min(12,stu(R.c.id).length);for(let r=0;r<3;r++)for(let c=0;c<4;c++){const u=1.3+c*1.8,v=3+r*1.6;P(.9,.75,.5,u,v,W,1);if(n++<ss)f(u,v+.6,pick(['#2563eb','#f59e0b','#ec4899','#10b981']),-.15)}

else if(t==='kosong')P(.9,.75,.5,2,4,W,1);
else if(t==='perpus'){for(let u=1;u<8;u+=1.5)P(1.1,2,.4,u,.4,'#a16207',1);P(2.2,.75,1,2.5,4.5,W,1);P(2.2,.75,1,5.5,4.5,W,1);f(2.5,5.4,'#8b5cf6',-.15)}

else if(t==='labipa'){for(let r=0;r<2;r++)for(let c=0;c<3;c++){const u=1.5+c*2.5,v=2.5+r*3;P(2.2,.9,1,u,v,'#e2e8f0',1);P(.25,.25,.25,u,v,'#22c55e',0,1.05)}}
else if(t==='kantin'){P(6,1,.8,4,1,'#b45309',1);for(let c=0;c<3;c++)P(1.4,.75,1,1.5+c*2.5,5,W,1);f(4,.4,'#f97316')}
